model_list: []
litellm_settings:
  callbacks: [qwen_context.policy]
  drop_params: false
  turn_off_message_logging: true
  set_verbose: false
  num_retries: 0
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: false
  allow_client_side_credentials: false
  trusted_proxy_ranges: [172.29.2.2/32]
  mcp_trusted_proxy_ranges: [172.29.2.2/32]
  disable_env_credential_login: true
  ui_access_mode: admin_only
  enable_claude_code_gateway: false
  max_failed_login_attempts_per_source: 10
  failed_login_window_seconds: 60
  failed_login_block_seconds: 300
router_settings:
  num_retries: 0
  fallbacks: []
